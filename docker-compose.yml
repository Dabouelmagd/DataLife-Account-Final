services:
  mongo_dl:
    image: mongo:7
    container_name: datalife_mongo
    restart: always
    volumes:
      - mongo_dl_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: A0Vdpix2QHAB7rkhd5zN
    networks:
      - datalife_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datalife_backend
    restart: always
    depends_on:
      - mongo_dl
    env_file: .env
    ports:
      - "8003:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - datalife_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: https://datalifeaccount.com
        CACHE_BUST: ${CACHE_BUST:-1}
    container_name: datalife_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3003:80"
    networks:
      - datalife_net

volumes:
  mongo_dl_data:
  uploads_data:

networks:
  datalife_net:
    driver: bridge
