let openSec=null,openQ={},q='';

function build(){
  document.getElementById('qnav').innerHTML=D.map(s=>
    `<a class="qn" href="#s-${s.id}" onclick="jump('${s.id}');return false">${s.ico} ${s.t.split(' ')[0]}</a>`
  ).join('');
}

function jump(id){document.getElementById('s-'+id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function doFilter(){q=document.getElementById('srch').value.toLowerCase();render()}

function render(){
  const filtered=D.map(s=>({...s,items:s.items.filter(i=>!q||i.q.includes(q)||i.a.includes(q))})).filter(s=>!q||s.items.length>0);
  const el=document.getElementById('body');
  if(!filtered.length){
    el.innerHTML=`<div class="empty"><p style="font-size:28px;opacity:.3">🔍</p><p style="margin-top:8px;font-size:14px;color:#64748b">لم يُوجد نتائج لـ "${q}"</p><button onclick="document.getElementById('srch').value='';q='';render()" style="margin-top:12px;font-size:12px;color:#3b82f6;background:none;border:none;cursor:pointer;text-decoration:underline">مسح البحث</button></div>`;
    return;
  }
  el.innerHTML=filtered.map(s=>{
    const open=q||openSec===s.id;

  const k=s.id+'_'+i,io=q||openQ[k];
  return `<div class="qi">

  <span class="qi-arr">&#9656;</span>

</div>`;
}

function toggleS(id){openSec=openSec===id?null:id;openQ={};render()}
function toggleQ(k){openQ[k]=!openQ[k];render()}
build();render();
